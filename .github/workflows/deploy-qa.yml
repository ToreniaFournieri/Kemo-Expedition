name: Deploy Pages (qa environment)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build qa artifact
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin qa >/dev/null 2>&1; then
            git fetch origin qa
            git worktree add ../kemo-qa origin/qa
          else
            echo 'Remote qa branch not found; using main build for /qa/ fallback.'
            git fetch origin main
            git worktree add ../kemo-qa origin/main
          fi

          npm ci --prefix ../kemo-qa
          npm run build --prefix ../kemo-qa

          rm -rf site
          mkdir -p site/qa

          cp -R ../kemo-qa/dist/. site/qa/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=./qa/" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Kemo Expedition</title>
            </head>
            <body>
              <p>Redirecting to <a href="./qa/">αテスト</a>...</p>
            </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
