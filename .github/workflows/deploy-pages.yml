name: Deploy Pages (all environments)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta
      - prod
    paths:
      - 'build_number.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build all environment artifacts
        env:
          VITE_DEV_DISCORD_WEBHOOK_URL: ${{ secrets.DEV_DISCORD_WEBHOOK_URL }}
          VITE_BETA_DISCORD_WEBHOOK_URL: ${{ secrets.BETA_DISCORD_WEBHOOK_URL }}
          VITE_FEEDBACK_DISCORD_WEBHOOK_URL: ${{ secrets.FEEDBACK_DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          mkdir -p site

          build_env() {
            env_name="$1"
            branch_name="$2"
            title_text="$3"
            link_text="$4"

            worktree_path="../kemo-${env_name}"
            target_branch="${branch_name}"

            if git ls-remote --exit-code --heads origin "${branch_name}" >/dev/null 2>&1; then
              git fetch origin "${branch_name}"
            else
              echo "Remote ${branch_name} branch not found; using main build for /${env_name}/ fallback."
              git fetch origin main
              target_branch="main"
            fi

            git worktree add "${worktree_path}" "origin/${target_branch}"

            npm ci --prefix "${worktree_path}"
            npm run build --prefix "${worktree_path}"

            mkdir -p "site/${env_name}"
            cp -R "${worktree_path}/dist/." "site/${env_name}/"

            git worktree remove "${worktree_path}" --force
          }

          build_env prod prod '本番環境' '本番環境'
          cp -R site/prod/. site/
          rm -rf site/prod

          build_env dev main '開発環境' '開発環境'
          build_env beta beta 'βテスト' 'βテスト'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
