name: Release browser and macOS builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'v* tag to create or release from the selected branch'
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    runs-on: macos-14
    outputs:
      signed: ${{ steps.apple-credentials.outputs.available }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11

      - name: Detect Apple release credentials
        id: apple-credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          present=0
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!variable}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "${present}" -eq 5 ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "Apple credentials found; packages will be signed and notarized."
          elif [[ "${present}" -eq 0 ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple credentials are unavailable; producing development-only unsigned packages."
          else
            echo "Only ${present} of 5 Apple credential secrets are configured." >&2
            echo "Configure the complete credential set or remove the partial configuration." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build, sign, and notarize macOS packages
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CREDENTIALS_AVAILABLE: ${{ steps.apple-credentials.outputs.available }}
        run: |
          set -euo pipefail
          if [[ "${APPLE_CREDENTIALS_AVAILABLE}" != "true" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # GitHub exposes an unavailable secret as an empty environment
            # variable. electron-builder still treats a defined CSC_LINK as a
            # certificate path, resolves the empty value to the repository
            # directory, and fails with "not a file". Remove all signing and
            # notarization variables for development-only unsigned builds.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run desktop:build

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: |
            release/desktop/bokemo-*-mac-arm64.dmg
            release/desktop/bokemo-*-mac-arm64.zip
            release/desktop/bokemo-*-mac-x64.dmg
            release/desktop/bokemo-*-mac-x64.zip
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${PUSHED_TAG}"
          fi

          if [[ ! "${tag}" =~ ^v.+$ ]]; then
            echo "Release tag must match v*." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release revision
        uses: actions/checkout@v5
        with:
          # A manually supplied tag may not exist yet. In that case, build the
          # exact branch revision that dispatched this workflow and let `gh`
          # create the tag when it creates the release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install

      - name: Build production browser bundle
        run: npm run build

      - name: Add local play instructions
        run: |
          cat > dist/LOCAL_PLAY.md <<'EOF'
          # Play BoKemo locally

          This directory must be served over HTTP; opening `index.html` directly is not supported.

          From this directory, run either:

          ```sh
          python -m http.server 8080
          ```

          or:

          ```sh
          npx serve .
          ```

          Then open http://localhost:8080/ in your browser.
          EOF

      - name: Package complete browser bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="bokemo-${VERSION}-browser.zip"
          (cd dist && zip -r "../${archive}" .)
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: macos-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          MACOS_SIGNED: ${{ needs.desktop.outputs.signed }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Download \`${ARCHIVE}\` and extract it to play this BoKemo browser release, or choose the DMG/ZIP matching your Mac's Apple Silicon (arm64) or Intel (x64) processor.

          See \`LOCAL_PLAY.md\` in the archive for local HTTP server instructions.
          EOF
          if [[ "${MACOS_SIGNED}" != "true" ]]; then
            cat >> release-notes.md <<'EOF'

          > **Development-only macOS packages:** Apple signing and notarization credentials were not available for this build. The attached DMG and macOS ZIP files are unsigned and are not intended for public distribution.
          EOF
          fi
          gh release create "${RELEASE_TAG}" "${ARCHIVE}" macos-artifacts/* \
            --target "${TARGET_SHA}" \
            --notes-file release-notes.md \
            --title "BoKemo ${RELEASE_TAG}"
