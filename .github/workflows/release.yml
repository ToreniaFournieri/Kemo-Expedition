name: Release browser build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'v* tag to create or release from the selected branch'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${PUSHED_TAG}"
          fi

          if [[ ! "${tag}" =~ ^v.+$ ]]; then
            echo "Release tag must match v*." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release revision
        uses: actions/checkout@v5
        with:
          # A manually supplied tag may not exist yet. In that case, build the
          # exact branch revision that dispatched this workflow and let `gh`
          # create the tag when it creates the release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build production browser bundle
        run: npm run build

      - name: Add local play instructions
        run: |
          cat > dist/LOCAL_PLAY.md <<'EOF'
          # Play BoKemo locally

          This directory must be served over HTTP; opening `index.html` directly is not supported.

          From this directory, run either:

          ```sh
          python -m http.server 8080
          ```

          or:

          ```sh
          npx serve .
          ```

          Then open http://localhost:8080/ in your browser.
          EOF

      - name: Package complete browser bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="bokemo-${VERSION}-browser.zip"
          (cd dist && zip -r "../${archive}" .)
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Download \`${ARCHIVE}\` and extract it to play this BoKemo browser release.

          See \`LOCAL_PLAY.md\` in the archive for local HTTP server instructions.
          EOF
          gh release create "${RELEASE_TAG}" "${ARCHIVE}" \
            --target "${TARGET_SHA}" \
            --notes-file release-notes.md \
            --title "BoKemo ${RELEASE_TAG}"
